# Канонический цвет -> синонимы.
# Синоним со звёздочкой на конце — основа прилагательного (черн* = черный, черная, черного, ...).
черный: [черн*, чёрн*, black, midnight]
белый: [бел*, white]
серый: [сер*, grey, gray, графитов*, graphite, space gray, space grey]
серебристый: [серебрист*, серебрян*, silver]
золотистый: [золотист*, золот*, gold]
синий: [син*, blue, navy]
голубой: [голуб*, light blue, sky blue]
зеленый: [зелен*, зелён*, green, мятн*, mint]
красный: [красн*, алый, ал*, red]
розовый: [розов*, pink, rose]
фиолетовый: [фиолетов*, лилов*, сиренев*, purple, violet, lavender]
желтый: [желт*, жёлт*, yellow]
оранжевый: [оранжев*, orange]
коричневый: [коричнев*, brown]
бежевый: [бежев*, beige]
бирюзовый: [бирюзов*, turquoise]
